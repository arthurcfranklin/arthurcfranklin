<svg xmlns="http://www.w3.org/2000/svg"
     width="380"
     height="104"
     viewBox="0 0 380 104"
     role="img"
     aria-labelledby="title description">

  <title id="title">Arthur Franklin Website</title>
  <desc id="description">Visit arthurfranklin.com.br</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="100%" stop-color="#111319"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.026"
            stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="380" height="104" rx="14" fill="url(#background)"/>

  <!-- Contact sequence indicator -->
<g>
  <rect
    x="24"
    y="13"
    width="52"
    height="3"
    rx="1.5"
    fill="#8f99a8"
    fill-opacity="0.32"
  />

  <circle
    cx="27"
    cy="14.5"
    r="3.5"
    fill="#d7dce4"
  />
</g>

  <rect width="380" height="104" rx="14" fill="url(#grid)"/>

<g transform="translate(24 28)">
    <circle cx="28" cy="28" r="25"
            fill="none"
            stroke="#aab3c1"
            stroke-width="1.8"/>

    <ellipse cx="28" cy="28" rx="11" ry="25"
             fill="none"
             stroke="#8d97a7"
             stroke-width="1.5"/>

    <path d="M3 28H53M8 16H48M8 40H48"
          fill="none"
          stroke="#8d97a7"
          stroke-width="1.4"/>
  </g>

  <text x="96" y="48"
        fill="#f4f6f8"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="18"
        font-weight="700">
    Website
  </text>

  <text x="96" y="73"
        fill="#929cab"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="13"
        font-weight="500">
    arthurfranklin.com.br
  </text>

  <path d="M338 44L348 52L338 60"
        fill="none"
        stroke="#b9c1cd"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <rect x="0.75" y="0.75"
        width="378.5" height="102.5"
        rx="13.25"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.09"
        stroke-width="1.5"/>
</svg>