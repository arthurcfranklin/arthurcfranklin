    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.028"
            stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="580" height="250" rx="16" fill="url(#background)"/>
