    PYTHON · SUPPORT OPERATIONS · PLANNED
  </text>

  <!-- Troubleshooting icon -->
  <g transform="translate(420 61) scale(0.88)">
    <circle
      cx="68"
      cy="65"
      r="44"
      fill="none"
      stroke="#aab3c1"
      stroke-opacity="0.68"
      stroke-width="2.3"
    />

    <path
      d="M99 96L125 122"
      fill="none"
      stroke="#d1d6de"
      stroke-width="4"
      stroke-linecap="round"
    />

    <path
