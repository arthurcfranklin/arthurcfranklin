      fill="none"
      stroke="#d1d6de"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M39 94H96"
      fill="none"
      stroke="#8791a1"
      stroke-width="2"
      stroke-linecap="round"
    />

    <circle cx="31" cy="94" r="4" fill="#9ba5b4"/>
    <circle cx="104" cy="94" r="4" fill="#9ba5b4"/>
  </g>

  <rect
    x="0.75"
    y="0.75"
    width="578.5"
    height="248.5"
    rx="15.25"
    fill="none"
    stroke="#ffffff"
