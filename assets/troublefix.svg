  </text>

  <text
    x="30"
    y="173"
    fill="#d2d7df"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="16"
  >
    documenting solutions and simplifying support.
  </text>

  <text
    x="30"
    y="216"
    fill="#818b9b"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="13"
    font-weight="500"
