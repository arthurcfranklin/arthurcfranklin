<svg xmlns="http://www.w3.org/2000/svg"
     width="580"
     height="250"
     viewBox="0 0 580 250"
     role="img"
     aria-labelledby="title description">

  <title id="title">TroubleFix</title>
  <desc id="description">
    Troubleshooting assistant for IT support workflows.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="100%" stop-color="#111319"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path
        d="M28 0H0V28"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.028"
        stroke-width="1"
      />
    </pattern>
  </defs>

  <rect width="580" height="250" rx="16" fill="url(#background)"/>
  <rect width="580" height="250" rx="16" fill="url(#grid)"/>

  <rect
    x="30"
    y="28"
    width="52"
    height="4"
    rx="2"
    fill="#b6becb"
  />

  <text
    x="30"
    y="75"
    fill="#f4f6f8"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="29"
    font-weight="700"
    letter-spacing="-0.6"
  >
    TroubleFix
  </text>

  <text
    x="30"
    y="108"
    fill="#b7bfcb"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="14"
    font-weight="600"
    letter-spacing="1.5"
  >
    IT TROUBLESHOOTING ASSISTANT
  </text>

  <text
    x="30"
    y="149"
    fill="#d2d7df"
    font-family="Inter, Segoe UI, Arial, sans-serif"
